[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "backup-to-s3"
version = "0.1.0"
description = "Stream a directory into an S3 multipart upload as a tar archive."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abe Megahed", email = "abe@gituhb.id" }]
keywords = ["s3", "backup", "tar", "multipart", "ebs"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Archiving :: Backup",
]

dependencies = [
    "boto3>=1.34",
    "tqdm>=4.56.0",
    "python-dotenv>=1.2.3",
    # botocore only trusts a current Mozilla root store when certifi is
    # importable; without it, it falls back to a stale vendored bundle.
    "certifi",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[s3]",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.scripts]
backup-to-s3 = "backup_to_s3:main"

[tool.hatch.build.targets.wheel]
only-include = ["backup_to_s3.py"]
sources = ["."]
exclude = ["./.env"]

[tool.hatch.build.targets.sdist]
include = ["backup_to_s3.py", "README.md", "pyproject.toml"]


# ----------------------------------------------------------------------
# pixi
# ----------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
# Resolved from conda-forge rather than PyPI. A conda package of the
# same name takes precedence over the [project.dependencies] entry.
python = ">=3.9"
boto3 = ">=1.34"
tqdm = ">=4.56.0"
python-dotenv = ">=1.2.3"
certifi = "*"

[tool.pixi.pypi-dependencies]
# Installs this project itself into the environment in editable mode,
# which is what makes the `backup-to-s3` command available.
backup-to-s3 = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
backup = "backup-to-s3"

[tool.pixi.feature.dev.tasks]
lint = "ruff check ."
fmt = "ruff format ."
typecheck = "mypy backup_to_s3.py"


# ----------------------------------------------------------------------
# tooling
# ----------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
